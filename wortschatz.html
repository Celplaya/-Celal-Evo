<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wortschatz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b211d; --panel:#232b26; --panel2:#2a332d; --line:#37423a;
  --ink:#e9e6dc; --muted:#8d968e; --brass:#c8a96a; --brass-dim:#9a8352;
  --der:#7fa5c4; --die:#c48a8a; --das:#93b08b;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Karla',sans-serif;font-size:16px;line-height:1.55;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 18px;border-bottom:1px solid var(--line);margin-bottom:20px}
.logo{font-family:'Fraunces',serif;font-weight:600;font-size:24px;letter-spacing:.2px}
.logo span{color:var(--brass)}
.streak{font-size:13px;color:var(--muted)}
.streak b{color:var(--brass);font-weight:600;font-size:15px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
h2{font-family:'Fraunces',serif;font-weight:500;font-size:19px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13.5px}
.today-nums{display:flex;gap:26px;margin:14px 0 16px}
.tn b{display:block;font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1.1}
.tn.due b{color:var(--brass)}
.tn span{font-size:12px;color:var(--muted);letter-spacing:.4px}
button{font-family:'Karla',sans-serif;cursor:pointer;border:none;border-radius:10px;font-size:15px}
.btn-main{background:var(--brass);color:#1c1913;font-weight:600;padding:13px 22px;width:100%;font-size:16px;transition:transform .08s}
.btn-main:active{transform:scale(.985)}
.btn-main:disabled{background:var(--panel2);color:var(--muted);cursor:default}
.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:999px;font-size:13.5px}
.chip.on{border-color:var(--brass);color:var(--brass)}
.cat{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
.cat:last-child{border-bottom:none}
.cat-info{flex:1;min-width:0}
.cat-name{font-weight:600;font-size:15px}
.cat-lvl{font-size:11.5px;color:var(--brass-dim);letter-spacing:.6px;margin-left:7px}
.bar{height:4px;background:var(--panel2);border-radius:4px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);border-radius:4px;transition:width .4s}
.cat-nums{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.method{font-size:13px;color:var(--muted);line-height:1.6;padding:14px 16px;border-left:2px solid var(--brass-dim);background:var(--panel);border-radius:0 var(--r) var(--r) 0}
/* session */
.sess-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:var(--muted)}
.sess-top button{background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px}
.progress{flex:1;height:3px;background:var(--panel2);border-radius:3px;margin:0 16px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brass);transition:width .3s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:44px 24px 38px;text-align:center;min-height:290px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.card .cat-tag{font-size:11.5px;letter-spacing:1.2px;color:var(--brass-dim);text-transform:uppercase;margin-bottom:18px}
.prompt{font-size:23px;font-weight:500}
.answer{font-family:'Fraunces',serif;font-size:37px;font-weight:600;line-height:1.15;margin-top:20px}
.answer .art{font-size:22px;font-weight:400;margin-right:8px}
.a-der{color:var(--der)} .a-die{color:var(--die)} .a-das{color:var(--das)}
.hint{color:var(--muted);font-size:13px;margin-top:26px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grade{padding:12px 4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:3px}
.grade small{font-weight:400;font-size:11px;color:var(--muted)}
.grade:active{background:var(--panel2)}
.g0{border-color:#7a4a44}.g3{border-color:var(--brass-dim)}
.reveal-btn{width:100%;padding:14px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-weight:600;margin-top:14px;border-radius:11px;font-size:15px}
.type-in{width:100%;margin-top:14px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:16px;font-family:'Karla',sans-serif}
.type-in:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass-dim)}
/* done */
.done{text-align:center;padding:60px 20px}
.done h2{font-size:26px;margin-bottom:10px}
.done .big{font-family:'Fraunces',serif;font-size:52px;font-weight:600;color:var(--brass);margin:18px 0 6px}
footer{margin-top:34px;text-align:center}
footer button{background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:6px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
button:focus-visible,.card:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>
</head>

const ART={r:["der","a-der"],e:["die","a-die"],s:["das","a-das"]};
const GRAM=[
["Werkwoord altijd op plek 2","In een gewone zin staat het vervoegde werkwoord ALTIJD op de tweede plek — ook als de zin met iets anders begint. Begin je met 'morgen', dan komt het werkwoord meteen daarna en schuift 'ik' erachter (inversie).",["Ich gehe morgen ins Gym.|Ik ga morgen naar de gym.","Morgen gehe ich ins Gym.|Morgen ga ik naar de gym.","Am Samstag arbeite ich nicht.|Zaterdag werk ik niet."]],
["Bijzin: werkwoord naar het einde","Na woorden als dass (dat), weil (omdat) en wenn (als) gaat het werkwoord helemaal naar het einde van de bijzin. Dit is dé regel die Duits 'Duits' maakt.",["Ich weiß, dass es teuer ist.|Ik weet dat het duur is.","Ich bleibe zu Hause, weil ich müde bin.|Ik blijf thuis omdat ik moe ben."]],
["Naamvallen light: der → den → dem","Het lidwoord verandert mee met de rol in de zin. Onderwerp: der Mann. Lijdend voorwerp (accusatief): den Mann. Na o.a. helfen, mit, zu (datief): dem Mann. Die en das veranderen alleen in de datief (der/dem).",["Der Mann ist nett.|De man is aardig. (onderwerp)","Ich sehe den Mann.|Ik zie de man. (accusatief)","Ich helfe dem Mann.|Ik help de man. (datief)"]],
["Verleden tijd: het Perfekt","Spreektaal gebruikt bijna altijd het Perfekt: haben/sein + voltooid deelwoord achteraan. Sein bij beweging of verandering (gegangen, gefahren), haben bij de rest. Net als in het Nederlands, alleen strikter: het deelwoord staat écht op het einde.",["Ich habe gestern gearbeitet.|Ik heb gisteren gewerkt.","Ich bin nach Zürich gefahren.|Ik ben naar Zürich gereden."]],

];
const NEW_PER_SESSION=15, MASTER_IV=21;

/* ---------- state & storage ---------- */
let S={cards:{},streak:0,lastDay:null,log:{},lvl:"Alles",typeMode:false};
let memOnly=false;
const today=()=>new Date().toISOString().slice(0,10);
async function load(){
  try{
    if(!window.storage){memOnly=true;return}
    const r=await window.storage.get("wortschatz-v1");
    if(r&&r.value)S=Object.assign(S,JSON.parse(r.value));
  }catch(e){/* geen data of storage niet beschikbaar */}
}
let saveT=null;
function save(){
  if(memOnly||!window.storage)return;
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{try{await window.storage.set("wortschatz-v1",JSON.stringify(S))}catch(e){console.error("opslaan mislukt",e)}},350);
}

/* ---------- SRS (vereenvoudigde SM-2) ---------- */
function getCard(i){return S.cards[i]||(S.cards[i]={iv:0,ease:2.5,reps:0,due:0})}
function preview(c,g){
  if(g===0)return"<10 min";
  let iv;
  if(g===1)iv=c.reps===0?1:Math.max(1,Math.round(c.iv*1.2));
  else if(g===2)iv=c.reps===0?1:(c.reps===1?3:Math.round(c.iv*c.ease));
  else iv=c.reps===0?2:(c.reps===1?4:Math.round(c.iv*c.ease*1.3));
  return iv+" d";
}
function grade(i,g){
  const c=getCard(i),now=Date.now();
  if(g===0){c.ease=Math.max(1.3,c.ease-0.2);c.iv=0;c.due=now+10*60*1000;}
  else{
    if(g===1){c.iv=c.reps===0?1:Math.max(1,Math.round(c.iv*1.2));c.ease=Math.max(1.3,c.ease-0.15);}
    if(g===2){c.iv=c.reps===0?1:(c.reps===1?3:Math.round(c.iv*c.ease));}
    if(g===3){c.iv=c.reps===0?2:(c.reps===1?4:Math.round(c.iv*c.ease*1.3));c.ease+=0.1;}
    c.reps++;c.due=now+c.iv*864e5;
  }
  const d=today();
  if(!S.log[d]){S.log[d]={n:0,rev:0};
    S.streak = S.lastDay===yesterday()? S.streak+1 : (S.lastDay===d? S.streak : 1);
    S.lastDay=d;
  }
  S.log[d].rev++;
  save();
}
function yesterday(){const t=new Date();t.setDate(t.getDate()-1);return t.toISOString().slice(0,10)}
const inLvl=i=>S.lvl==="Alles"||W[i][1]===S.lvl;
function dueIds(){const n=Date.now();return W.map((_,i)=>i).filter(i=>S.cards[i]&&S.cards[i].reps>0&&S.cards[i].due<=n&&inLvl(i))}
function newIds(){
  // geen daglimiet meer — elke sessie brengt max NEW_PER_SESSION nieuwe kaarten
  return W.map((_,i)=>i).filter(i=>!S.cards[i]||S.cards[i].reps===0).filter(inLvl).slice(0,NEW_PER_SESSION);
}

/* ---------- views ---------- */
const app=document.getElementById("app");
let view="home",queue=[],pos=0,flipped=false,sessDone=0,catFilter=null,checkResult=null;

function header(){
  return `<header><div class="logo">Wort<span>schatz</span></div><div class="streak">streak <b>${S.streak}</b> ${S.streak===1?"dag":"dagen"}</div></header>`;
}
function home(){
  const due=dueIds().length,nw=newIds().length;
  const chips=["Alles","A1","A2","B1"].map(l=>`<button class="chip ${S.lvl===l?"on":""}" onclick="setLvl('${l}')">${l}</button>`).join("");
  let cats="";
  for(const k in CATS){
    const ids=W.map((_,i)=>i).filter(i=>W[i][0]===k&&inLvl(i));
    if(!ids.length)continue;
    const seen=ids.filter(i=>S.cards[i]&&S.cards[i].reps>0).length;
    const mast=ids.filter(i=>S.cards[i]&&S.cards[i].iv>=MASTER_IV).length;
    const lvls=[...new Set(ids.map(i=>W[i][1]))].sort().join(" · ");
    cats+=`<div class="cat" role="button" tabindex="0" onclick="startCat('${k}')" onkeydown="if(event.key==='Enter')startCat('${k}')" style="cursor:pointer">
      <div class="cat-info"><span class="cat-name">${CATS[k]}</span><span class="cat-lvl">${lvls}</span>
      <div class="bar"><i style="width:${ids.length?Math.round(seen/ids.length*100):0}%"></i></div></div>
      <div class="cat-nums">${seen}/${ids.length} gezien<br>${mast} beheerst</div></div>`;
  }
  app.innerHTML=header()+`
  <div class="chips">${chips}</div>
  <div class="panel">
    <h2>Vandaag</h2><div class="sub">Herhalingen komen terug op het moment dat je ze bijna vergeet.</div>
    <div class="today-nums">
      <div class="tn due"><b>${due}</b><span>TE HERHALEN</span></div>
      <div class="tn"><b>${nw}</b><span>NIEUW IN SESSIE</span></div>
      <div class="tn"><b>${(S.log[today()]||{}).rev||0}</b><span>GEDAAN VANDAAG</span></div>
    </div>
    <button class="btn-main" ${due+nw===0?"disabled":""} onclick="startSession()">${due+nw===0?"Alles geleerd — kom terug voor herhalingen":"Start sessie ("+(due+nw)+" kaarten)"}</button>
    <button class="chip ${S.typeMode?"on":""}" onclick="toggleType()" style="margin-top:12px">Antwoord typen: ${S.typeMode?"aan":"uit"}</button>
    <span class="sub" style="font-size:12px;margin-left:8px">${S.typeMode?"traint spelling & precisie":"hardop zeggen, zelf beoordelen"}</span>
    <div class="legend"><span><i class="dot" style="background:var(--der)"></i>der</span><span><i class="dot" style="background:var(--die)"></i>die</span><span><i class="dot" style="background:var(--das)"></i>das</span><span style="margin-left:auto">leer het lidwoord als kleur mee</span></div>
  </div>
  <div class="panel">${cats}</div>
  <button class="reveal-btn" onclick="gramView()" style="margin:0 0 14px">Grammatica-gids · de 6 regels</button>
  <div class="method"><b style="color:var(--ink)">De methode.</b> Je ziet het Nederlands en haalt het Duits actief uit je geheugen — dat ophalen zelf is de training. Daarna beoordeel je jezelf eerlijk: het algoritme plant elk woord opnieuw in vlak vóór het vergeetmoment. Kort en dagelijks wint van lang en soms.</div>
  <footer><button onclick="resetAll()">Voortgang wissen</button></footer>
  ${memOnly?'<div class="note">Let op: opslag niet beschikbaar — voortgang geldt alleen voor deze sessie.</div>':""}`;
}
function startCat(k){catFilter=k;startSession()}
function setLvl(l){S.lvl=l;save();home()}
function startSession(){
  let due=dueIds(),nw=newIds();
  if(catFilter){due=due.filter(i=>W[i][0]===catFilter);nw=W.map((_,i)=>i).filter(i=>W[i][0]===catFilter&&inLvl(i)&&(!S.cards[i]||S.cards[i].reps===0)&&!due.includes(i)).slice(0,NEW_PER_SESSION);}
  queue=[...due,...nw];
  if(!queue.length){catFilter=null;home();return}
  // nieuwe kaarten tellen voor daglimiet (alleen algemene sessie)
  pos=0;sessDone=0;flipped=false;view="sess";render();
}
function render(){view==="home"?home():view==="sess"?sess():done()}
function sess(){
  if(pos>=queue.length){view="done";render();return}
  const i=queue[pos],[cat,lvl,art,de,nl]=W[i],c=getCard(i);
  const artHtml=ART[art]?`<span class="art ${ART[art][1]}">${ART[art][0]}</span>`:"";
  let fb="";
  if(flipped&&checkResult){
    if(checkResult.k==="perfect")fb=`<div class="hint" style="color:var(--das)">Perfect — ook de spelling klopt</div>`;
    else if(checkResult.k==="close")fb=`<div class="hint" style="color:var(--brass)">Bijna goed — let op spelling of hoofdletters.<br>Jij typte: &ldquo;${checkResult.t}&rdquo;</div>`;
    else fb=`<div class="hint" style="color:var(--die)">Nog niet.${checkResult.t?`<br>Jij typte: &ldquo;${checkResult.t}&rdquo;`:""}</div>`;
  }
  const bottom=flipped
    ?`<div class="grades">
    <button class="grade g0" onclick="ans(0)">Opnieuw<small>${preview(c,0)}</small></button>
    <button class="grade" onclick="ans(1)">Moeilijk<small>${preview(c,1)}</small></button>
    <button class="grade" onclick="ans(2)">Goed<small>${preview(c,2)}</small></button>
    <button class="grade g3" onclick="ans(3)">Makkelijk<small>${preview(c,3)}</small></button>
  </div>`
    :(S.typeMode
      ?`<input id="typein" class="type-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Typ het Duits (ae/oe/ue mag voor umlauten)" onkeydown="if(event.key==='Enter')checkTyped()">
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="reveal-btn" style="margin-top:0;flex:1" onclick="checkTyped()">Controleer</button>
          <button class="reveal-btn" style="margin-top:0;flex:0 0 auto;padding:14px 16px" onclick="checkResult={k:'wrong',t:''};flip()">Weet ik niet</button>
        </div>`
      :`<button class="reveal-btn" onclick="flip()">Toon antwoord</button>`);
  app.innerHTML=header()+`
  <div class="sess-top"><span>${sessDone} / ${queue.length}</span><div class="progress"><i style="width:${Math.round(sessDone/queue.length*100)}%"></i></div><button onclick="endSess()">stoppen</button></div>
  <div class="card" tabindex="0" ${!S.typeMode&&!flipped?'onclick="flip()"':""}>
    <div class="cat-tag">${CATS[cat]} · ${lvl}${c.reps===0?" · nieuw":""}</div>
    <div class="prompt">${nl}</div>
    ${flipped?`<div class="answer">${artHtml}${de}</div>${fb}`:`<div class="hint">${S.typeMode?"Typ het Duitse antwoord hieronder":"Zeg het antwoord hardop, tik dan om te checken"}</div>`}
  </div>${bottom}`;
  const ti=document.getElementById("typein");if(ti)ti.focus();
}
function checkTyped(){
  const el=document.getElementById("typein"),t=(el?el.value:"").trim();
  const [,,art,de]=W[queue[pos]];
  const strip=s=>s.replace(/[.,!?…'’"“”]/g,"").replace(/\s+/g," ").trim();
  const norm=s=>strip(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  const targets=[de];if(ART[art])targets.push(ART[art][0]+" "+de);
  let k="wrong";
  for(const tg of targets){
    if(strip(t)===strip(tg)){k="perfect";break}
    if(norm(t)===norm(tg))k="close";
  }
  if(!t)k="wrong";
  checkResult={k,t};flipped=true;render();
}
function toggleType(){S.typeMode=!S.typeMode;save();home()}
function flip(){flipped=true;render()}
function ans(g){
  const i=queue[pos],wasNew=getCard(i).reps===0;
  grade(i,g);
  if(g===0)queue.push(i);else sessDone++;
  queue.splice(pos,1);
  flipped=false;checkResult=null;render();
}
function endSess(){catFilter=null;view="home";render()}
function done(){
  catFilter=null;
  const more=dueIds().length+newIds().length;
  app.innerHTML=header()+`<div class="done panel"><h2>Sessie klaar</h2><div class="big">${sessDone}</div><div class="sub">kaarten geoefend · streak: ${S.streak} ${S.streak===1?"dag":"dagen"}</div>
  ${more>0?`<button class="btn-main" style="margin-top:26px" onclick="startSession()">Nog een sessie (${more} kaarten)</button>`:""}
  <button class="btn-main" style="margin-top:${more>0?"10":"26"}px;background:transparent;color:var(--ink);border:1px solid var(--line)" onclick="view='home';render()">Terug naar overzicht</button></div>`;
}
function gramView(){
  const lessons=GRAM.map((l,n)=>{
    const ex=l[2].map(p=>{const[de,nl]=p.split("|");return `<div style="margin:8px 0"><span style="font-family:'Fraunces',serif;font-size:17px">${de}</span><br><span style="color:var(--muted);font-size:13px">${nl}</span></div>`}).join("");
    return `<div class="panel"><div class="cat-tag" style="font-size:11.5px;letter-spacing:1.2px;color:var(--brass-dim);text-transform:uppercase;margin-bottom:8px">Regel ${n+1}</div><h2 style="font-size:17px">${l[0]}</h2><p class="sub" style="margin:8px 0 12px;line-height:1.6">${l[1]}</p>${ex}</div>`;
  }).join("");
  app.innerHTML=header()+`<div class="sess-top"><span>Grammatica-gids</span><span></span><button onclick="view='home';render()">terug</button></div>${lessons}
  <button class="btn-main" onclick="catFilter='gram';startSession()">Oefen deze regels als drills</button>
  <div class="note" style="margin-top:10px">Tip: lees één regel, oefen dan de drills — regels beklijven pas door ze te gebruiken.</div>`;
}
async function resetAll(){
  if(!confirm("Alle voortgang en je streak wissen?"))return;
  S={cards:{},streak:0,lastDay:null,log:{},lvl:S.lvl};
  try{if(window.storage)await window.storage.set("wortschatz-v1",JSON.stringify(S))}catch(e){}
  home();
}
document.addEventListener("keydown",e=>{
  if(view!=="sess")return;
  if(e.target&&e.target.id==="typein")return;
  if(e.code==="Space"&&!flipped&&!S.typeMode){e.preventDefault();flip()}
  else if(flipped&&["1","2","3","4"].includes(e.key))ans(Number(e.key)-1);
});
window.startCat=startCat;window.setLvl=setLvl;window.startSession=startSession;window.flip=flip;window.ans=ans;window.endSess=endSess;window.resetAll=resetAll;window.render=render;window.gramView=gramView;window.checkTyped=checkTyped;window.toggleType=toggleType;
load().then(home);
</script>
