name: Deploy to PocketBase pb_public

on:
  push:
    branches: [main, claude/add-file-to-repo-cdd7tr]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, truenas]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy static files to pb_public
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:7}"
          cp app.js data.js mascot.js style.css sync.js favicon.svg /deploy/
          cp -r vendor /deploy/
          sed -E "s#(src|href)=\"(app\.js|data\.js|mascot\.js|style\.css|sync\.js|vendor/pocketbase\.umd\.js)\"#\1=\"\2?v=${SHA}\"#g" wortschatz.html > /deploy/wortschatz.html
          cp /deploy/wortschatz.html /deploy/index.html

      - name: Fix permissions for PocketBase
        run: chmod -R a+rX /deploy
